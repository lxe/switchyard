[package]
name = "inference-fleet-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Deterministic inference fleet simulator and scheduler test harness"
publish = false
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
