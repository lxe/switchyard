[workspace]
members = [".", "crates/*"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[workspace.dependencies]
switchyard-core = { path = "crates/switchyard-core", version = "0.1.0" }
switchyard-scheduler = { path = "crates/switchyard-scheduler", version = "0.1.0" }
switchyard-sim = { path = "crates/switchyard-sim", version = "0.1.0" }
switchyard-gauntlet = { path = "crates/switchyard-gauntlet", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[package]
name = "switchyard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Inference simulation, scheduling, routing, and validation toolkit"
readme = "README.md"

[dependencies]
switchyard-core.workspace = true
switchyard-scheduler.workspace = true
switchyard-sim.workspace = true
switchyard-gauntlet.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
reqwest.workspace = true

[lints]
workspace = true
