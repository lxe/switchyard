[package]
name = "switchyard-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Qwen3.5 inference on hand-written CUDA kernels with continuous batching"

[dependencies]
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "cublas", "cuda-13000", "dynamic-loading"] }
safetensors = "0.8.0"
memmap2 = "0.9.11"
half = "2.7.1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
axum.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokenizers.workspace = true
minijinja.workspace = true
minijinja-contrib.workspace = true

[features]
default = []
# Compiles the kernels with nvcc. Without it the crate builds (for CPU CI) but
# cannot load a model.
cuda = []

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
